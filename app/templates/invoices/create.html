{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-plus-circle me-2"></i>Create Invoice</h1>
        <p class="text-muted mb-0">Create a new invoice for your client</p>
    </div>
    <a href="{{ url_for('invoices.list_invoices') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST" id="invoiceForm">

            <!-- Invoice Details -->
            <div class="mb-4 pb-4 border-bottom">
                <h5 class="fw-bold mb-3"><i class="bi bi-info-circle me-2 text-primary"></i>Invoice Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Client</label>
                        <select name="client_id" class="form-select" required>
                            <option value="">Select Client</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Invoice Number</label>
                        <input type="text" name="invoice_number" class="form-control" value="{{ invoice_number }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Issue Date</label>
                        <input type="date" name="issue_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Due Date</label>
                        <input type="date" name="due_date" class="form-control" required>
                    </div>
                </div>
            </div>

            <!-- Line Items -->
            <div class="mb-4 pb-4 border-bottom">
                <h5 class="fw-bold mb-3"><i class="bi bi-list-ul me-2 text-primary"></i>Line Items</h5>
                <div class="table-responsive">
                    <table class="table table-bordered items-table">
                        <thead class="table-dark">
                            <tr>
                                <th>Product</th>
                                <th>Description</th>
                                <th>Qty</th>
                                <th>Unit</th>
                                <th>Price ($)</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody">
                            <tr class="item-row">
                                <td>
                                    <select class="product-select form-select form-select-sm" onchange="fillProduct(this)">
                                        <option value="">-- Select --</option>
                                        {% for product in products %}
                                        <option value="{{ product.id }}"
                                            data-name="{{ product.name }}"
                                            data-description="{{ product.description }}"
                                            data-price="{{ product.unit_price }}"
                                            data-unit="{{ product.unit }}">
                                            {{ product.name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="text" name="description[]" class="form-control form-control-sm" placeholder="Description" required></td>
                                <td><input type="number" name="quantity[]" class="form-control form-control-sm" placeholder="1" min="0.01" step="0.01" oninput="calculateTotal()" required></td>
                                <td>
                                    <select name="unit[]" class="form-select form-select-sm">
                                        <option value="sq ft">sq ft</option>
                                        <option value="sq meter">sq meter</option>
                                        <option value="piece/qty">piece/qty</option>
                                        <option value="kg">kg</option>
                                        <option value="gram">gram</option>
                                        <option value="ton">ton</option>
                                        <option value="meter">meter</option>
                                        <option value="liter">liter</option>
                                        <option value="hour">hour</option>
                                    </select>
                                </td>
                                <td><input type="number" name="unit_price[]" class="form-control form-control-sm" placeholder="0.00" min="0" step="0.01" oninput="calculateTotal()" required></td>
                                <td class="row-total fw-bold text-primary">$0.00</td>
                                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">✕</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="addRow()">
                    <i class="bi bi-plus-lg me-1"></i> Add Item
                </button>
            </div>

            <!-- Summary -->
            <div class="mb-4 pb-4 border-bottom">
                <h5 class="fw-bold mb-3"><i class="bi bi-calculator me-2 text-primary"></i>Summary</h5>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Tax (%)</label>
                        <input type="number" name="tax" id="taxInput" class="form-control" value="0" min="0" max="100" step="0.01" oninput="calculateTotal()">
                    </div>
                    <div class="col-md-4 offset-md-4">
                        <div class="bg-light rounded p-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal:</span>
                                <strong id="subtotal">$0.00</strong>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Tax:</span>
                                <strong id="taxAmount">$0.00</strong>
                            </div>
                            <div class="d-flex justify-content-between border-top pt-2">
                                <span class="fw-bold">Total:</span>
                                <span class="fw-bold text-primary fs-5" id="grandTotal">$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-sticky me-2 text-primary"></i>Notes</h5>
                <textarea name="notes" class="form-control" placeholder="Any additional notes for the client..." rows="3"></textarea>
            </div>

            <button type="submit" class="btn w-100 py-3 fs-5" style="background:#e94560; color:white; border:none; border-radius:8px; font-weight:600;">
                <i class="bi bi-check-lg me-2"></i> Save Invoice
            </button>
        </form>
    </div>
</div>

<script>
function fillProduct(select) {
    const row = select.closest('tr');
    const option = select.options[select.selectedIndex];
    if (option.value) {
        row.querySelector('[name="description[]"]').value = option.dataset.description || option.dataset.name;
        row.querySelector('[name="unit_price[]"]').value = option.dataset.price;
        const unitSelect = row.querySelector('[name="unit[]"]');
        for (let i = 0; i < unitSelect.options.length; i++) {
            if (unitSelect.options[i].value === option.dataset.unit) {
                unitSelect.selectedIndex = i;
                break;
            }
        }
        calculateTotal();
    }
}

function addRow() {
    const tbody = document.getElementById('itemsBody');
    const row = document.createElement('tr');
    row.className = 'item-row';
    row.innerHTML = `
        <td>
            <select class="product-select form-select form-select-sm" onchange="fillProduct(this)">
                ${getProductOptions()}
            </select>
        </td>
        <td><input type="text" name="description[]" class="form-control form-control-sm" placeholder="Description" required></td>
        <td><input type="number" name="quantity[]" class="form-control form-control-sm" placeholder="1" min="0.01" step="0.01" oninput="calculateTotal()" required></td>
        <td>
            <select name="unit[]" class="form-select form-select-sm">
                <option value="sq ft">sq ft</option>
                <option value="sq meter">sq meter</option>
                <option value="piece/qty">piece/qty</option>
                <option value="kg">kg</option>
                <option value="gram">gram</option>
                <option value="ton">ton</option>
                <option value="meter">meter</option>
                <option value="liter">liter</option>
                <option value="hour">hour</option>
            </select>
        </td>
        <td><input type="number" name="unit_price[]" class="form-control form-control-sm" placeholder="0.00" min="0" step="0.01" oninput="calculateTotal()" required></td>
        <td class="row-total fw-bold text-primary">$0.00</td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">✕</button></td>
    `;
    tbody.appendChild(row);
}

function getProductOptions() {
    const firstSelect = document.querySelector('.product-select');
    return firstSelect ? firstSelect.innerHTML : '';
}

function removeRow(btn) {
    const rows = document.querySelectorAll('.item-row');
    if (rows.length > 1) {
        btn.closest('tr').remove();
        calculateTotal();
    }
}

function calculateTotal() {
    const rows = document.querySelectorAll('.item-row');
    let subtotal = 0;
    rows.forEach(row => {
        const qty = parseFloat(row.querySelector('[name="quantity[]"]').value) || 0;
        const price = parseFloat(row.querySelector('[name="unit_price[]"]').value) || 0;
        const rowTotal = qty * price;
        row.querySelector('.row-total').textContent = '$' + rowTotal.toFixed(2);
        subtotal += rowTotal;
    });
    const tax = parseFloat(document.getElementById('taxInput').value) || 0;
    const taxAmount = subtotal * (tax / 100);
    const total = subtotal + taxAmount;
    document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
    document.getElementById('taxAmount').textContent = '$' + taxAmount.toFixed(2);
    document.getElementById('grandTotal').textContent = '$' + total.toFixed(2);
}
</script>
{% endblock %}
