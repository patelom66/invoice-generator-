{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-plus-circle me-2"></i>Add Product</h1>
        <p class="text-muted mb-0">Add a new product to your inventory</p>
    </div>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header"><i class="bi bi-info-circle me-2"></i>Product Details</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Red Paver Block" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="e.g. Premium red paver block">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit of Measurement</label>
                            <select name="unit" class="form-select">
                                <option value="sq ft">sq ft</option>
                                <option value="sq meter">sq meter</option>
                                <option value="piece/qty">piece/qty</option>
                                <option value="kg">kg</option>
                                <option value="gram">gram</option>
                                <option value="ton">ton</option>
                                <option value="meter">meter</option>
                                <option value="liter">liter</option>
                                <option value="hour">hour</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit Price ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" name="unit_price" class="form-control" placeholder="0.00" min="0" step="0.01" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" name="stock" class="form-control" placeholder="0" min="0" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-lg me-1"></i> Save Product
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header"><i class="bi bi-lightbulb me-2"></i>Tips</div>
            <div class="card-body">
                <p class="text-muted small">💡 Use <strong>sq ft</strong> for paver blocks and tiles.</p>
                <p class="text-muted small">💡 Use <strong>piece/qty</strong> for individual items like kerb stones.</p>
                <p class="text-muted small">💡 Stock quantity will show <span class="badge bg-danger">red</span> when below 10 units.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
