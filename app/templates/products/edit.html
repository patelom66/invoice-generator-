{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-pencil me-2"></i>Edit Product</h1>
        <p class="text-muted mb-0">Update product details</p>
    </div>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header"><i class="bi bi-info-circle me-2"></i>Product Details</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" value="{{ product.description }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit of Measurement</label>
                            <select name="unit" class="form-select">
                                <option value="sq ft" {% if product.unit == 'sq ft' %}selected{% endif %}>sq ft</option>
                                <option value="sq meter" {% if product.unit == 'sq meter' %}selected{% endif %}>sq meter</option>
                                <option value="piece/qty" {% if product.unit == 'piece/qty' %}selected{% endif %}>piece/qty</option>
                                <option value="kg" {% if product.unit == 'kg' %}selected{% endif %}>kg</option>
                                <option value="gram" {% if product.unit == 'gram' %}selected{% endif %}>gram</option>
                                <option value="ton" {% if product.unit == 'ton' %}selected{% endif %}>ton</option>
                                <option value="meter" {% if product.unit == 'meter' %}selected{% endif %}>meter</option>
                                <option value="liter" {% if product.unit == 'liter' %}selected{% endif %}>liter</option>
                                <option value="hour" {% if product.unit == 'hour' %}selected{% endif %}>hour</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit Price ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" name="unit_price" class="form-control" value="{{ product.unit_price }}" min="0" step="0.01" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" name="stock" class="form-control" value="{{ product.stock }}" min="0" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-lg me-1"></i> Update Product
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header"><i class="bi bi-graph-up me-2"></i>Current Stats</div>
            <div class="card-body">
                <p class="text-muted small">📦 Current Stock: <strong>{{ product.stock }} {{ product.unit }}</strong></p>
                <p class="text-muted small">💰 Current Price: <strong>${{ "%.2f"|format(product.unit_price) }}</strong></p>
                <p class="text-muted small">📐 Unit: <span class="unit-badge">{{ product.unit }}</span></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
